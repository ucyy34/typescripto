<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırla - Dostan Marketplace</title>

    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a4a3a, #2d6853);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #2d6853;
            margin: 0;
            font-size: 2rem;
        }

        .logo p {
            color: #666;
            margin: 0.5rem 0 0 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2d6853;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d6853;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #2d6853;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #1a4a3a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }

        .back-link a {
            color: #2d6853;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #060;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .invalid-token {
            text-align: center;
            padding: 2rem;
        }

        .invalid-token h2 {
            color: #c00;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .reset-container {
                padding: 2rem 1.5rem;
            }

            .logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="logo">
            <h1>🔐 Yeni Şifre Belirle</h1>
            <p>Yeni şifrenizi girin</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div id="invalidToken" class="invalid-token" style="display: none;">
            <h2>⚠️ Geçersiz Link</h2>
            <p>Bu şifre sıfırlama linki geçersiz veya eksik.</p>
            <a href="forgot-password.html" class="btn" style="display: inline-block; margin-top: 1rem;">
                Yeni link iste
            </a>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">Yeni Şifre</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
                <div class="password-requirements">
                    En az 8 karakter, büyük harf, küçük harf ve rakam içermeli
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Şifre Tekrar</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Şifremi Değiştir
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">← Giriş sayfasına dön</a>
        </div>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/api-client.js"></script>
    <script>
        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const invalidToken = document.getElementById('invalidToken');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check if token exists
        if (!token) {
            resetForm.style.display = 'none';
            invalidToken.style.display = 'block';
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Hide previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Şifreler eşleşmiyor!';
                errorMessage.classList.add('show');
                return;
            }

            // Validate password strength
            if (password.length < 8) {
                errorMessage.textContent = 'Şifre en az 8 karakter olmalı!';
                errorMessage.classList.add('show');
                return;
            }

            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                errorMessage.textContent = 'Şifre büyük harf, küçük harf ve rakam içermeli!';
                errorMessage.classList.add('show');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Değiştiriliyor...';

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Bir hata oluştu');
                }

                // Show success message
                successMessage.innerHTML = `
                    ✅ ${data.message}<br><br>
                    🔄 Giriş sayfasına yönlendiriliyorsunuz...
                `;
                successMessage.classList.add('show');

                // Hide form
                resetForm.style.display = 'none';

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Reset password error:', error);
                errorMessage.textContent = error.message || 'Bir hata oluştu. Lütfen tekrar deneyin.';
                errorMessage.classList.add('show');

                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifremi Değiştir';
            }
        });
    </script>
</body>

</html>
