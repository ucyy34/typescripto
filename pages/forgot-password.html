<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - Dostan Marketplace</title>

    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a4a3a, #2d6853);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .forgot-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #2d6853;
            margin: 0;
            font-size: 2rem;
        }

        .logo p {
            color: #666;
            margin: 0.5rem 0 0 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2d6853;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d6853;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #2d6853;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #1a4a3a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }

        .back-link a {
            color: #2d6853;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #060;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .info-box {
            background: #f0f8ff;
            border: 1px solid #b8daff;
            color: #0c5460;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .forgot-container {
                padding: 2rem 1.5rem;
            }

            .logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="forgot-container">
        <div class="logo">
            <h1>🔒 Şifremi Unuttum</h1>
            <p>E-posta adresinizi girin</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="info-box">
            📧 E-posta adresinize şifre sıfırlama linki göndereceğiz.<br>
            <small>(Test modunda: Link backend konsoluna yazılacak)</small>
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" required placeholder="ornek@email.com">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Şifre Sıfırlama Linki Gönder
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">← Giriş sayfasına dön</a>
        </div>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/api-client.js"></script>
    <script>
        const forgotForm = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            // Hide previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Gönderiliyor...';

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Bir hata oluştu');
                }

                // Show success message
                successMessage.innerHTML = `
                    ✅ ${data.message}<br><br>
                    <strong>Test modu:</strong> Backend konsolundaki linki kontrol edin.
                `;
                successMessage.classList.add('show');

                // Hide form
                forgotForm.style.display = 'none';

            } catch (error) {
                console.error('Forgot password error:', error);
                errorMessage.textContent = error.message || 'Bir hata oluştu. Lütfen tekrar deneyin.';
                errorMessage.classList.add('show');

                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifre Sıfırlama Linki Gönder';
            }
        });
    </script>
</body>

</html>
