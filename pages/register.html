<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dostan Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/password-toggle.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a4a3a, #2d6853);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .register-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #2d6853;
            margin: 0;
            font-size: 2rem;
        }

        .logo p {
            color: #666;
            margin: 0.5rem 0 0 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2d6853;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2d6853;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #2d6853;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #1a4a3a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: #666;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }

        .login-link a {
            color: #2d6853;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #060;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .seller-fields {
            display: none;
            border-top: 1px solid #f0f0f0;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
        }

        .seller-fields h3 {
            margin: 0 0 1rem 0;
            color: #2d6853;
            font-size: 1.1rem;
        }

        .form-note {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .register-container {
                padding: 2rem 1.5rem;
            }

            .logo h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🛍️ Dostan Marketplace</h1>
            <p>Create your account</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required placeholder="John">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
                <div class="password-requirements">
                    Min 8 characters, include uppercase, lowercase, and number
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="role">I want to:</label>
                <select id="role" name="role" required>
                    <option value="buyer">Buy Products (Customer)</option>
                    <option value="seller">Sell Products (Vendor)</option>
                </select>
            </div>

            <div id="sellerFields" class="seller-fields">
                <h3>Seller Store Details</h3>
                <div class="form-group">
                    <label for="storeName">Store Name</label>
                    <input type="text" id="storeName" name="storeName" placeholder="Nordic Treasures">
                </div>
                <div class="form-group">
                    <label for="storeDescription">Store Description</label>
                    <textarea id="storeDescription" name="storeDescription" rows="3" placeholder="Tell us about your products"
                        style="width: 100%; padding: 0.875rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; box-sizing: border-box;"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="storeCity">City</label>
                        <input type="text" id="storeCity" name="storeCity" placeholder="İstanbul">
                    </div>
                    <div class="form-group">
                        <label for="storePhone">Phone</label>
                        <input type="tel" id="storePhone" name="storePhone" placeholder="+90 555 123 45 67">
                    </div>
                </div>
                <p class="form-note">Mağazanız admin onayı sonrası yayına alınacaktır.</p>
            </div>

            <button type="submit" class="btn" id="registerBtn">
                Create Account
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="../assets/js/auth-manager.js"></script>
    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/api-client.js"></script>
    <script src="../assets/js/password-toggle.js"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const roleSelect = document.getElementById('role');
        const sellerFields = document.getElementById('sellerFields');

        const toggleSellerFields = () => {
            if (!roleSelect || !sellerFields) return;
            sellerFields.style.display = roleSelect.value === 'seller' ? 'block' : 'none';
        };

        if (roleSelect) {
            toggleSellerFields();
            roleSelect.addEventListener('change', toggleSellerFields);
        }

        // Check if already logged in
        if (AuthManager.getToken()) {
            window.location.href = 'profile.html';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const storeNameInput = document.getElementById('storeName');
            const storeDescriptionInput = document.getElementById('storeDescription');
            const storeCityInput = document.getElementById('storeCity');
            const storePhoneInput = document.getElementById('storePhone');

            // Hide previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match!';
                errorMessage.classList.add('show');
                return;
            }

            // Validate password strength
            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters long!';
                errorMessage.classList.add('show');
                return;
            }

            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                errorMessage.textContent = 'Password must include uppercase, lowercase, and number!';
                errorMessage.classList.add('show');
                return;
            }

            if (role === 'seller' && storeNameInput && storeNameInput.value.trim().length < 3) {
                errorMessage.textContent = 'Please enter a store name to create your seller account.';
                errorMessage.classList.add('show');
                return;
            }

            // Disable button
            registerBtn.disabled = true;
            registerBtn.textContent = '⏳ Creating account...';

            try {
                const apiClient = new ApiClient();
                const response = await apiClient.register({
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password,
                    role: role
                });

                if (!response.success) {
                    throw new Error(response.message || 'Registration failed. Please try again.');
                }

                const data = response.data || {};
                const tokens = data.tokens || {};
                const user = data.user || data;

                if (!tokens.accessToken) {
                    throw new Error('No token received from server');
                }

                AuthManager.login(tokens, user);

                let storeApplicationSubmitted = false;
                let storeError = null;

                if (role === 'seller') {
                    const storePayload = {
                        name: storeNameInput?.value.trim(),
                    };

                    if (storeDescriptionInput && storeDescriptionInput.value.trim()) {
                        storePayload.description = storeDescriptionInput.value.trim();
                    }
                    if (storeCityInput && storeCityInput.value.trim()) {
                        storePayload.city = storeCityInput.value.trim();
                    }
                    if (storePhoneInput && storePhoneInput.value.trim()) {
                        storePayload.phone = storePhoneInput.value.trim();
                    }

                    try {
                        const storeResponse = await apiClient.createStore(storePayload);
                        if (storeResponse.success) {
                            storeApplicationSubmitted = true;
                        } else {
                            storeError = storeResponse.message || 'Store could not be created automatically.';
                        }
                    } catch (storeErr) {
                        storeError = storeErr.message || 'Store creation failed. You can complete it later from the vendor panel.';
                    }

                    if (storeError) {
                        console.warn('Automatic store creation failed:', storeError);
                        errorMessage.textContent = `Hesabınız oluşturuldu fakat mağaza başvurusu tamamlanamadı: ${storeError}`;
                        errorMessage.classList.add('show');
                    }
                }

                // Show success
                if (role === 'seller') {
                    if (storeApplicationSubmitted) {
                        successMessage.textContent = 'Satıcı hesabınız oluşturuldu! Mağaza başvurunuz yönetici onayına gönderildi. Onay sonrası mağaza paneliniz otomatik olarak aktifleşecektir.';
                    } else {
                        successMessage.textContent = 'Satıcı hesabınız oluşturuldu. Mağaza başvurunuzu satıcı panelinden tamamlayabilirsiniz.';
                    }
                } else {
                    successMessage.textContent = 'Account created successfully! Redirecting...';
                }
                successMessage.classList.add('show');

                // Redirect based on role
                setTimeout(() => {
                    if (role === 'seller') {
                        window.location.href = '../vendorcss/index.html';
                    } else {
                        window.location.href = 'profile.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('Register error:', error);
                errorMessage.textContent = error.message || 'Registration failed. Please try again.';
                errorMessage.classList.add('show');

                // Re-enable button
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });

    </script>
</body>
</html>
