<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dostan API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d6853 0%, #1a4032 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #2d6853;
        }

        .test-section h2 {
            color: #2d6853;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2d6853;
        }

        button {
            background: linear-gradient(135deg, #2d6853 0%, #1a4032 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(45, 104, 83, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            max-height: 300px;
            overflow-y: auto;
        }

        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
        }

        .success {
            border-color: #28a745;
            background: #d4edda;
        }

        .error {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .info {
            background: #d1ecf1;
            border-color: #17a2b8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info strong {
            color: #0c5460;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Dostan Marketplace API Test</h1>
            <p>Backend API'yi test edin</p>
        </div>

        <div class="content">
            <div class="info">
                <strong><span class="status-indicator status-online"></span>Server Status:</strong>
                <span id="serverStatus">Checking...</span>
            </div>

            <!-- Health Check -->
            <div class="test-section">
                <h2>1. Health Check</h2>
                <button onclick="testHealth()">Test Server Health</button>
                <div id="healthResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Register -->
            <div class="test-section">
                <h2>2. Register User</h2>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="regEmail" value="test@example.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="regPassword" value="Test12345!">
                </div>
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" id="regFirstName" value="Ahmet">
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" id="regLastName" value="Yılmaz">
                </div>
                <div class="form-group">
                    <label>Role:</label>
                    <select id="regRole">
                        <option value="buyer">Buyer (Alıcı)</option>
                        <option value="seller">Seller (Satıcı)</option>
                    </select>
                </div>
                <button onclick="testRegister()">Register</button>
                <div id="registerResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Login -->
            <div class="test-section">
                <h2>3. Login User</h2>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" value="test@example.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" value="Test12345!">
                </div>
                <button onclick="testLogin()">Login</button>
                <div id="loginResponse" class="response" style="display:none;"></div>
            </div>

            <!-- Get Profile -->
            <div class="test-section">
                <h2>4. Get Profile (Requires Login)</h2>
                <button onclick="testProfile()">Get My Profile</button>
                <div id="profileResponse" class="response" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api/v1';
        let accessToken = null;

        // Check server health on load
        window.addEventListener('load', testHealth);

        async function testHealth() {
            const responseDiv = document.getElementById('healthResponse');
            const statusDiv = document.getElementById('serverStatus');

            try {
                const response = await fetch('http://localhost:3001/health');
                const data = await response.json();

                responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                responseDiv.className = 'response success';
                responseDiv.style.display = 'block';

                statusDiv.innerHTML = '<strong style="color: #28a745;">✅ Server Online</strong>';
            } catch (error) {
                responseDiv.innerHTML = `<pre style="color: #dc3545;">❌ Error: ${error.message}</pre>`;
                responseDiv.className = 'response error';
                responseDiv.style.display = 'block';

                statusDiv.innerHTML = '<strong style="color: #dc3545;">❌ Server Offline</strong>';
            }
        }

        async function testRegister() {
            const responseDiv = document.getElementById('registerResponse');

            const data = {
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                first_name: document.getElementById('regFirstName').value,
                last_name: document.getElementById('regLastName').value,
                role: document.getElementById('regRole').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    accessToken = result.data.tokens.accessToken;
                    responseDiv.className = 'response success';
                } else {
                    responseDiv.className = 'response error';
                }

                responseDiv.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                responseDiv.style.display = 'block';
            } catch (error) {
                responseDiv.innerHTML = `<pre style="color: #dc3545;">❌ Error: ${error.message}</pre>`;
                responseDiv.className = 'response error';
                responseDiv.style.display = 'block';
            }
        }

        async function testLogin() {
            const responseDiv = document.getElementById('loginResponse');

            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    accessToken = result.data.tokens.accessToken;
                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('user', JSON.stringify(result.data.user));
                    responseDiv.className = 'response success';

                    alert('✅ Login successful! Token saved to localStorage');
                } else {
                    responseDiv.className = 'response error';
                }

                responseDiv.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                responseDiv.style.display = 'block';
            } catch (error) {
                responseDiv.innerHTML = `<pre style="color: #dc3545;">❌ Error: ${error.message}</pre>`;
                responseDiv.className = 'response error';
                responseDiv.style.display = 'block';
            }
        }

        async function testProfile() {
            const responseDiv = document.getElementById('profileResponse');

            if (!accessToken) {
                accessToken = localStorage.getItem('accessToken');
            }

            if (!accessToken) {
                responseDiv.innerHTML = `<pre style="color: #dc3545;">❌ Please login first!</pre>`;
                responseDiv.className = 'response error';
                responseDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                const result = await response.json();

                if (result.success) {
                    responseDiv.className = 'response success';
                } else {
                    responseDiv.className = 'response error';
                }

                responseDiv.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                responseDiv.style.display = 'block';
            } catch (error) {
                responseDiv.innerHTML = `<pre style="color: #dc3545;">❌ Error: ${error.message}</pre>`;
                responseDiv.className = 'response error';
                responseDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
